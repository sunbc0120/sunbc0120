name: Generate 3D contribution calendar

on:
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:
  push:
    branches:
      - profile-readme-3d-polish
    paths:
      - ".github/workflows/profile-3d.yml"
      - "profile-3d-settings.json"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5

      - name: Generate light and dark 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: profile-3d-settings.json

      - name: Commit refreshed visual
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/profile-google-dual.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh 3D contribution calendar"
          git push
