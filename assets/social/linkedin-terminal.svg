<svg xmlns="http://www.w3.org/2000/svg" width="420" height="116" viewBox="0 0 420 116" role="img" aria-labelledby="title desc">
  <title id="title">LinkedIn endpoint</title>
  <desc id="desc">Terminal-style link to Baichuan Sun on LinkedIn.</desc>
  <style>
    :root { color-scheme: light dark; }
    .bg { fill: #f6f8fa; stroke: #d0d7de; }
    .label, .command { fill: #1f2328; }
    .muted { fill: #656d76; }
    .command { fill: #0550ae; }
    .status { fill: #1a7f37; }
    .dot { fill: #1a7f37; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #161b22; stroke: #30363d; }
      .label, .command { fill: #f0f6fc; }
      .muted { fill: #8b949e; }
      .command { fill: #79c0ff; }
      .status, .dot { fill: #3fb950; }
    }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  </style>
  <rect class="bg" x=".5" y=".5" width="419" height="115" rx="8"/>
  <rect x="18" y="15" width="28" height="28" rx="5" fill="#0A66C2"/><text x="24" y="36" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">in</text>
  <text class="label" x="58" y="34" font-size="13" font-weight="700" letter-spacing=".7">LINKEDIN</text>
  <circle class="dot" cx="347" cy="29" r="4"/>
  <text class="status" x="358" y="34" font-size="11" font-weight="700">OPEN</text>
  <text class="command" x="18" y="73" font-size="14">$ ssh linkedin@sunbc0120</text>
  <text class="muted" x="18" y="98" font-size="12">tcp/443 · professional network</text>
</svg>
