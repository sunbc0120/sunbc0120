<svg xmlns="http://www.w3.org/2000/svg" width="420" height="116" viewBox="0 0 420 116" role="img" aria-labelledby="title desc">
  <title id="title">Google Scholar endpoint</title>
  <desc id="desc">Terminal-style link to Baichuan Sun on Google Scholar.</desc>
  <style>
    :root { color-scheme: light dark; }
    .bg { fill: #f6f8fa; stroke: #d0d7de; }
    .label, .command { fill: #1f2328; }
    .muted { fill: #656d76; }
    .command { fill: #0550ae; }
    .status { fill: #1a7f37; }
    .dot { fill: #1a7f37; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #161b22; stroke: #30363d; }
      .label, .command { fill: #f0f6fc; }
      .muted { fill: #8b949e; }
      .command { fill: #79c0ff; }
      .status, .dot { fill: #3fb950; }
    }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  </style>
  <rect class="bg" x=".5" y=".5" width="419" height="115" rx="8"/>
  <g transform="translate(18 16) scale(1.16)" fill="#4285F4"><path d="M5.242 13.769L0 9.5 12 0l12 9.5-5.242 4.269C17.548 11.249 14.978 9.5 12 9.5c-2.977 0-5.548 1.748-6.758 4.269zM12 10a7 7 0 1 0 0 14 7 7 0 0 0 0-14z"/></g>
  <text class="label" x="58" y="34" font-size="13" font-weight="700" letter-spacing=".7">GOOGLE SCHOLAR</text>
  <circle class="dot" cx="347" cy="29" r="4"/>
  <text class="status" x="358" y="34" font-size="11" font-weight="700">INDEXED</text>
  <text class="command" x="18" y="73" font-size="14">$ query scholar://z4j3xxUAAAAJ</text>
  <text class="muted" x="18" y="98" font-size="12">https · publications &amp; citations</text>
</svg>
